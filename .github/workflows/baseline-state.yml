name: One-time four-source production baseline only
on:
  workflow_dispatch:
    inputs:
      repository:
        type: string
        required: true
        description: Exact approved repository
      branch:
        type: string
        required: true
        description: Exact existing production state branch
      authorization:
        type: string
        required: true
        description: Exact single baseline authorization
      confirmation:
        type: string
        required: true
        description: Type BASELINE_FOUR_SOURCES_ONCE_NO_DISCORD
      expected_sha:
        type: string
        required: true
        description: Exact reviewed trusted main commit
permissions:
  contents: read
concurrency:
  group: production-baseline-once
  cancel-in-progress: false
jobs:
  baseline:
    if: github.repository == 'DigitizedInspirations/discord-video-alerts' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      BASELINE_REPOSITORY: ${{ inputs.repository }}
      BASELINE_BRANCH: ${{ inputs.branch }}
      BASELINE_AUTHORIZATION: ${{ inputs.authorization }}
      BASELINE_CONFIRMATION: ${{ inputs.confirmation }}
      BASELINE_EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Mock regressions without credentials
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Safeguard audit without credentials
        run: python scripts/release_audit.py
      - name: Verify reviewed empty production state without writes
        run: python scripts/baseline_production_state.py preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify all four finite public windows in memory
        run: python scripts/baseline_production_state.py metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: One optimistic state update and independent read-only verification
        run: python scripts/baseline_production_state.py write
        env:
          GITHUB_TOKEN: ${{ github.token }}
