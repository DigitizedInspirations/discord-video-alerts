name: Isolated GitHub durable-state canary
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [seed, verify]
        required: true
        description: First seed, then verify from a separate fresh workflow run
      branch:
        type: string
        default: dva-canary-20261016-0f9d3a7c
        required: true
        description: Exact approved disposable branch; all other values are rejected
      expected_sha:
        type: string
        required: true
        description: Reviewed main commit SHA
      seed_run_id:
        type: string
        default: ''
        description: Completed seed workflow run ID, required for verify
permissions:
  contents: read
concurrency:
  group: dva-canary-20261016-0f9d3a7c
  cancel-in-progress: false
jobs:
  canary:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Mock regressions without credentials
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Safeguard audit without credentials
        run: python scripts/release_audit.py
      - name: Exact-branch synthetic persistence canary
        run: python scripts/durable_canary.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANARY_PHASE: ${{ inputs.phase }}
          CANARY_BRANCH: ${{ inputs.branch }}
          CANARY_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CANARY_SEED_RUN_ID: ${{ inputs.seed_run_id }}
