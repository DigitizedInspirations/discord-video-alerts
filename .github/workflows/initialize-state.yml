name: One-time empty production state initialization
on:
  workflow_dispatch:
    inputs:
      repository:
        type: string
        default: DigitizedInspirations/discord-video-alerts
        required: true
        description: Exact approved repository
      branch:
        type: string
        default: notification-state
        required: true
        description: Exact production state branch; must not already exist
      operation:
        type: choice
        options: [initialize_empty_state]
        required: true
        description: Only creation of empty state is authorized
      confirmation:
        type: string
        required: true
        description: Type INITIALIZE_EMPTY_NOTIFICATION_STATE_ONCE
      expected_sha:
        type: string
        required: true
        description: Exact reviewed trusted main commit
permissions:
  contents: read
concurrency:
  group: production-state-initialization
  cancel-in-progress: false
jobs:
  initialize:
    if: github.repository == 'DigitizedInspirations/discord-video-alerts' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Mock regressions without credentials
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Safeguard audit without credentials
        run: python scripts/release_audit.py
      - name: Create once and independently verify empty state
        run: python scripts/initialize_production_state.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INIT_REPOSITORY: ${{ inputs.repository }}
          INIT_BRANCH: ${{ inputs.branch }}
          INIT_OPERATION: ${{ inputs.operation }}
          INIT_CONFIRMATION: ${{ inputs.confirmation }}
          INIT_EXPECTED_SHA: ${{ inputs.expected_sha }}
