name: Discord Video Alerts — controlled operations
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [validate, initialize, monitor, dryrun, manual, test, show, edit, delete, resolve, restore]
        default: dryrun
        description: Operation
      source:
        type: choice
        options: [youtube_dayz, youtube_milo_mia, tiktok_dayz, tiktok_milo_mia]
        default: youtube_dayz
        description: Source
      video_url:
        type: string
        description: Manual/test video URL (blank uses approved Short fixture for test)
      post_id:
        type: string
        description: Recorded post ID for show/edit/delete
      message_id:
        type: string
        description: Existing Discord message ID to resolve uncertain delivery
      live:
        type: boolean
        default: false
        description: Send real Discord messages (requires confirmation)
      confirmation:
        type: string
        description: INITIALIZE, SEND, REPOST, EDIT, DELETE, RESOLVE or RESTORE
      repost:
        type: boolean
        default: false
        description: Intentional repost (requires REPOST)
      use_template:
        type: boolean
        default: true
        description: Use source template; false sends video URL only
      restore_ref:
        type: string
        description: Full commit SHA on notification-state for recovery
permissions:
  contents: read
concurrency:
  group: discord-video-alerts-state
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
      - name: Execute validated operation
        run: python scripts/workflow_entry.py
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_VIDEO_URL: ${{ inputs.video_url }}
          INPUT_POST_ID: ${{ inputs.post_id }}
          INPUT_MESSAGE_ID: ${{ inputs.message_id }}
          INPUT_LIVE: ${{ inputs.live }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_REPOST: ${{ inputs.repost }}
          INPUT_USE_TEMPLATE: ${{ inputs.use_template }}
          INPUT_RESTORE_REF: ${{ inputs.restore_ref }}
