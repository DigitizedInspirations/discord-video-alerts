name: Read-only Linux and isolated state validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Assert production safeguards
        run: python scripts/release_audit.py
      - name: Isolated persistence across fresh processes
        run: python scripts/cloud_state_simulation.py
      - name: Dependency compatibility
        run: python -m pip check
