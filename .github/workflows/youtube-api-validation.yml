name: Restricted YouTube API metadata validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: -r requirements.lock'
      - name: Mock tests without secrets
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Assert production safeguards without secrets
        run: python scripts/release_audit.py
      - name: Read-only stateless YouTube API check
        run: python scripts/validate_youtube_api.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
